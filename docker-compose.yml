services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibot_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - .:/var/www/html
      - ./supervisor/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    networks:
      - aibot_net
    depends_on:
      db:
        condition: service_started
    environment:
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE:-aibot}
      - DB_USERNAME=${DB_USERNAME:-aibot}
      - DB_PASSWORD=${DB_PASSWORD:-aibot123}
      - CRM_DB_HOST=${CRM_DB_HOST:-db}
      - CRM_DB_PORT=${CRM_DB_PORT:-5432}
      - CRM_DB_DATABASE=${CRM_DB_DATABASE:-aibot}
      - CRM_DB_USERNAME=${CRM_DB_USERNAME:-aibot}
      - CRM_DB_PASSWORD=${CRM_DB_PASSWORD:-aibot123}
  
  db:
    image: ankane/pgvector:latest
    container_name: aibot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-aibot}
      POSTGRES_USER: ${DB_USERNAME:-aibot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aibot123}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - aibot_net

networks:
  aibot_net:
    driver: bridge

volumes:
  dbdata:
