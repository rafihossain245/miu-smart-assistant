services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aibot_app
    restart: unless-stopped
    working_dir: /var/www/html
    ports:
      - "9001:9000"
      - "8080:8080"
    volumes:
      - .:/var/www/html
    networks:
      - aibot_net
    depends_on:
      db:
        condition: service_started
    environment:
      - CRM_DB_HOST=${CRM_DB_HOST}
      - CRM_DB_PORT=${CRM_DB_PORT:-3307}
      - CRM_DB_DATABASE=${CRM_DB_DATABASE:-perfexcrm}
      - CRM_DB_USERNAME=${CRM_DB_USERNAME:-root}
      - CRM_DB_PASSWORD=${CRM_DB_PASSWORD}
  
  db:
    image: ankane/pgvector:latest
    container_name: aibot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - aibot_net

networks:
  aibot_net:
    driver: bridge

volumes:
  dbdata: